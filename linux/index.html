<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Linux Quest · Dev Quest</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="../shared/dq.css" />
</head>
<body>
<div id="app">
  <header id="dqbar"></header>

  <div id="main">
    <aside id="sidebar">
      <details id="missionListDetails" class="sidebar-section" open>
        <summary>퀘스트 목록 <span id="currentMissionLabel" class="current-mission-label"></span></summary>
        <div id="missionList"></div>
      </details>
      <div class="sidebar-section">
        <button id="cheatSheetBtn">📖 지금까지 배운 명령어</button>
      </div>
    </aside>

    <section id="terminalPane">
      <div id="missionBrief">
        <h3 id="missionTitle">-</h3>
        <p id="missionDesc">-</p>
        <div id="hintArea">
          <button id="hintBtn">💡 힌트 보기</button>
          <button id="conceptBtn" class="hidden">📚 왜 배우나요?</button>
          <div id="hintText" class="hidden"></div>
          <div id="conceptText" class="hidden"></div>
        </div>
      </div>

      <div id="terminalWindow">
        <div class="terminal-titlebar">
          <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
          <span class="terminal-title">user@linux-game: ~</span>
          <button id="resetMissionBtn" title="이 미션 다시 시작">↺ 초기화</button>
        </div>
        <div id="terminalOutput"></div>
        <div id="viBuffer" class="vi-buffer hidden"></div>
        <div id="terminalInputLine" class="terminal-input-line">
          <span id="promptLabel" class="prompt">user@linux-game:~$</span>
          <input id="terminalInput" autocomplete="off" spellcheck="false" autofocus />
        </div>
        <div id="viStatusBar" class="vi-status-bar hidden"></div>
      </div>
    </section>
  </div>
</div>

<div id="cheatSheetModal" class="modal hidden">
  <div class="modal-content">
    <button id="closeCheatSheet" class="modal-close">✕</button>
    <h2>📖 지금까지 배운 명령어</h2>
    <div id="cheatSheetList"></div>
  </div>
</div>

<script src="../courses.js"></script>
<script src="../shared/dq.js"></script>
<script src="js/missions.js"></script>
<script src="js/script.js" defer></script>
</body>
</html>
