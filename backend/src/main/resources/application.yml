spring:
  application:
    name: dev-quest
  # Railway 의 PostgreSQL 은 PGHOST·PGPORT·PGDATABASE·PGUSER·PGPASSWORD 를 넣어 줘요.
  # 로컬에서는 backend/compose.yaml 의 값(기본값, 포트 5433)으로 붙어요.
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:devquest}
    username: ${PGUSER:devquest}
    password: ${PGPASSWORD:devquest}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway 마이그레이션만 바꿔요
  flyway:
    locations: classpath:db/migration
  session:
    timeout: 8h # 자동 로그인을 안 골라도 8시간 동안 아무것도 안 하면 로그아웃
    jdbc:
      initialize-schema: never # 세션 테이블은 Flyway(V2)가 만들어요
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true # 파일을 고치면 바로 반영 (ETag·Last-Modified 로 재검증)

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  shutdown: graceful
  forward-headers-strategy: framework # Railway 프록시 뒤에서 https 주소를 올바르게 인식
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

devquest:
  remember-me:
    # 자동 로그인 인증 객체 확인용 키. 비우면 서버를 켤 때마다 새로 만들어요 (토큰 자체는 DB 로 검증해서 그래도 동작해요)
    key: ${REMEMBER_ME_KEY:}
  limits:
    login-failures: 5     # 같은 아이디+IP 로 15분 안에 이만큼 틀리면 15분 차단
    signups-per-hour: 10  # 같은 IP 에서 1시간에 가입할 수 있는 횟수
