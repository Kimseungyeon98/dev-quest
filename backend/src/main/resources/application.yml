spring:
  application:
    name: dev-quest
  # Railway 의 PostgreSQL 은 PGHOST·PGPORT·PGDATABASE·PGUSER·PGPASSWORD 를 넣어 줘요.
  # 로컬에서는 backend/compose.yaml 의 값(기본값, 포트 5433)으로 붙어요.
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:devquest}
    username: ${PGUSER:devquest}
    password: ${PGPASSWORD:devquest}
    hikari:
      # 모든 테이블을 이 스키마에 둬요. 다른 앱(예: 같은 Railway Postgres 를 쓰는 luck-lounge)의
      # public 스키마 테이블과 이름이 겹치지 않게요. 연결할 때 search_path 를 이 스키마로 맞춰요.
      schema: ${DB_SCHEMA:devquest}
      # Railway Serverless(안 쓸 때 잠들기)는 몇 분 동안 바깥으로 나가는 트래픽이 없어야 잠들어요. DB 연결도 트래픽이라
      # 쉬는 연결은 1분 뒤 모두 닫고(minimum-idle 0), 연결 유지용 ping(keepalive)도 꺼요.
      minimum-idle: 0
      idle-timeout: 60000
      keepalive-time: 0
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway 마이그레이션만 바꿔요
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:devquest}
  flyway:
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:devquest} # 없으면 Flyway 가 만들어요 (기록 테이블도 이 스키마 안에)
    default-schema: ${DB_SCHEMA:devquest}
    create-schemas: true
  session:
    timeout: 8h # 자동 로그인을 안 골라도 8시간 동안 아무것도 안 하면 로그아웃
    jdbc:
      initialize-schema: never # 세션 테이블은 Flyway(V2)가 만들어요
      cleanup-cron: "0 23 * * * *" # 만료 세션 정리 (기본은 매분 DB 조회라 서비스가 잠들지 못해서 1시간마다)
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true # 파일을 고치면 바로 반영 (ETag·Last-Modified 로 재검증)

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  shutdown: graceful
  forward-headers-strategy: framework # Railway 프록시 뒤에서 https 주소를 올바르게 인식
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

devquest:
  # 하루·한 주를 나누는 기준 시간대 (연속 학습일·이번 주 기록·주간 랭킹). 한 주는 월요일부터
  timezone: ${DEVQUEST_TIMEZONE:Asia/Seoul}
  # 관리자 API(임시 비밀번호 발급)를 켜는 토큰. 24자 이상이어야 켜져요. 비워 두면 꺼져요
  admin-token: ${ADMIN_TOKEN:}
  remember-me:
    # 자동 로그인 인증 객체 확인용 키. 비우면 서버를 켤 때마다 새로 만들어요 (토큰 자체는 DB 로 검증해서 그래도 동작해요)
    key: ${REMEMBER_ME_KEY:}
  progress:
    # 저장할 수 있는 과목은 퀘스트 카탈로그(shared/quests.json, courses.js 에서 생성)의 과목이에요
    # 과목 하나의 진행도 JSON 최대 크기 (Algorithm Quest 는 작성 중인 코드까지 저장해서 넉넉히)
    max-bytes: 524288
  limits:
    login-failures: 5     # 같은 아이디+IP 로 15분 안에 이만큼 틀리면 15분 차단
    signups-per-hour: 10  # 같은 IP 에서 1시간에 가입할 수 있는 횟수
