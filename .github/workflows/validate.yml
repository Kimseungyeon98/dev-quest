name: validate

# 퀘스트 데이터와 엔진을 고칠 때마다 검증 스크립트를 돌려요.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Algorithm Quest 모범 답안을 진짜 javac / java 로 채점해요
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: JS 문법 검사
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f"; done

      - name: 퀘스트 카탈로그(shared/quests.json)가 최신인지
        run: node shared/tools/build-quest-catalog.js --check

      - name: Git Quest 시나리오 검증
        run: node git/tools/validate-scenarios.js

      - name: Algorithm Quest 문제 검증
        run: node algo/tools/validate-problems.js

  # Spring Boot 백엔드 테스트 (Testcontainers 로 PostgreSQL 을 띄워요)
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 테스트
        run: ./gradlew test --console=plain

  # Railway 와 같은 Dockerfile 로 이미지를 만들고, Railway 처럼 PORT·DATABASE_URL 만 주고 띄워 봐요
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: railway
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: 배포 이미지 빌드
        run: docker build -t dev-quest .

      # 같은 Postgres 를 쓰는 다른 앱(public 스키마에 users·flyway 기록이 이미 있음)을 흉내 내요
      - name: 다른 앱이 쓰던 DB 준비
        env:
          PGPASSWORD: ci-password
        run: |
          psql -h localhost -U postgres -d railway -v ON_ERROR_STOP=1 \
            -c "create table users (id serial primary key, email text not null)" \
            -c "insert into users (email) values ('other-app@example.com')" \
            -c "create table flyway_schema_history (installed_rank int primary key, description text)" \
            -c "insert into flyway_schema_history values (1, 'other app')"

      - name: 컨테이너 실행
        run: |
          docker run -d --name app --network host \
            -e PORT=8080 \
            -e DATABASE_URL=postgresql://postgres:ci-password@localhost:5432/railway \
            dev-quest

      - name: 헬스체크·로그인 화면 확인
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 302
          # 빨리 깨어나기: CDS 아카이브가 실제로 쓰이는지 (아카이브가 안 맞으면 JVM 이 조용히 무시해서 여기서 확인해요)
          docker logs app 2>&1 | grep -E "Started DevQuestApplication in"
          docker exec app java -XX:SharedArchiveFile=/app/app.jsa -Xshare:on -cp /app/app.jar -version

      - name: 다른 앱의 테이블은 그대로인지 확인
        env:
          PGPASSWORD: ci-password
        run: |
          test "$(psql -h localhost -U postgres -d railway -tAc "select email from public.users")" = other-app@example.com
          test "$(psql -h localhost -U postgres -d railway -tAc "select count(*) from public.flyway_schema_history")" = 1
          # dev-quest 테이블은 devquest 스키마에만 (테이블이 늘어나도 깨지지 않게 개수 대신 주요 테이블 확인)
          test "$(psql -h localhost -U postgres -d railway -tAc "select count(*) from information_schema.tables where table_schema = 'devquest' and table_name in ('users', 'progress', 'course_scores', 'flyway_schema_history')")" = 4
          test "$(psql -h localhost -U postgres -d railway -tAc "select count(*) from information_schema.tables where table_schema = 'public'")" = 2

      - name: 실패하면 앱 로그 출력
        if: failure()
        run: docker logs app || true

  # 브라우저 테스트: 진짜 서버(jar)를 띄우고 Playwright 로 로그인·동기화·허브·과목 화면을 확인해요
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devquest
          POSTGRES_USER: devquest
          POSTGRES_PASSWORD: devquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: 서버 빌드
        working-directory: backend
        run: ./gradlew --no-daemon -q bootJar -x test

      - name: 서버 실행
        run: |
          PGPORT=5432 PGDATABASE=devquest java -jar backend/build/libs/dev-quest-*.jar \
            --server.port=8080 --devquest.limits.signups-per-hour=100000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/actuator/health && break; sleep 2; done

      - name: Playwright 설치
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 브라우저 테스트
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: 실패하면 서버 로그
        if: failure()
        run: tail -n 200 server.log

      - name: 실패하면 테스트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
