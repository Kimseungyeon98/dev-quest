name: validate

# 퀘스트 데이터와 엔진을 고칠 때마다 검증 스크립트를 돌려요.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Algorithm Quest 모범 답안을 진짜 javac / java 로 채점해요
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: JS 문법 검사
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f"; done

      - name: Git Quest 시나리오 검증
        run: node git/tools/validate-scenarios.js

      - name: Algorithm Quest 문제 검증
        run: node algo/tools/validate-problems.js

  # Spring Boot 백엔드 테스트 (Testcontainers 로 PostgreSQL 을 띄워요)
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 테스트
        run: ./gradlew test --console=plain

  # Railway 와 같은 Dockerfile 로 이미지를 만들고, Railway 처럼 PORT·DATABASE_URL 만 주고 띄워 봐요
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: railway
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: 배포 이미지 빌드
        run: docker build -t dev-quest .

      - name: 컨테이너 실행
        run: |
          docker run -d --name app --network host \
            -e PORT=8080 \
            -e DATABASE_URL=postgresql://postgres:ci-password@localhost:5432/railway \
            dev-quest

      - name: 헬스체크·로그인 화면 확인
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 302

      - name: 실패하면 앱 로그 출력
        if: failure()
        run: docker logs app || true
